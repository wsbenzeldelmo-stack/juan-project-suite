window.JuanOnlineBoot=(()=>{
  const started=performance.now();
  let finished=false;
  const finish=()=>{
    if(finished)return;finished=true;
    const el=document.getElementById("jpOnlineWebBoot");if(!el)return;
    const wait=Math.max(0,720-(performance.now()-started));
    setTimeout(()=>{el.classList.add("is-hidden");el.setAttribute("aria-busy","false");setTimeout(()=>el.remove(),220)},wait);
  };
  const failsafe=setTimeout(finish,8000);
  return {finish:()=>{clearTimeout(failsafe);finish();}};
})();
