<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>JUAN PROJECT Online</title><link rel="icon" href="/assets/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png"><link rel="apple-touch-icon" href="/assets/apple-touch-icon.png"><link rel="manifest" href="/manifest.webmanifest"><style>html,body{margin:0;min-height:100%;background:#f7faf8;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#root{min-height:100dvh}.jp-boot-shell{min-height:100dvh;display:grid;place-items:center;padding:24px;box-sizing:border-box;background:radial-gradient(circle at 50% 38%,#effff7 0,#f7faf8 34%,#fff 72%);color:#747d78;text-align:center}.jp-boot-card{width:min(380px,calc(100vw - 36px));display:grid;justify-items:center;gap:12px;padding:30px 26px 26px;background:#fff;border:1px solid rgba(17,24,39,.07);border-radius:24px;box-shadow:0 24px 70px rgba(20,43,34,.10)}.jp-boot-mark{position:relative;width:68px;height:68px;display:grid;place-items:center;border-radius:21px;background:#eafff4;overflow:hidden}.jp-boot-mark:after{content:"";position:absolute;inset:-34%;border:2px solid transparent;border-top-color:#18bd78;border-radius:50%;animation:jpbootspin 1.05s linear infinite}.jp-boot-mark img{position:relative;z-index:1;width:32px;height:32px;object-fit:contain}.jp-boot-kicker{font-size:9px;font-weight:850;letter-spacing:.12em;color:#078451}.jp-boot-title{font-size:20px;font-weight:850;letter-spacing:-.025em;color:#17201c}.jp-boot-copy{font-size:11px;line-height:1.45;color:#7a837f}.jp-boot-line{width:150px;height:4px;border-radius:999px;background:#edf2ef;overflow:hidden;position:relative}.jp-boot-line:after{content:"";position:absolute;inset:0;width:44%;border-radius:inherit;background:#1fbf82;animation:jpbootinline 1.15s ease-in-out infinite}.jp-boot-dots{display:flex;gap:5px}.jp-boot-dots i{width:5px;height:5px;border-radius:50%;background:#ccd7d1;animation:jpbootdot 1.2s ease-in-out infinite}.jp-boot-dots i:nth-child(2){animation-delay:.15s}.jp-boot-dots i:nth-child(3){animation-delay:.3s}@keyframes jpbootspin{to{transform:rotate(360deg)}}@keyframes jpbootinline{from{transform:translateX(-110%)}to{transform:translateX(230%)}}@keyframes jpbootdot{0%,70%,100%{transform:translateY(0);background:#ccd7d1}35%{transform:translateY(-4px);background:#1fbf82}}</style><link rel="preload" href="/css/app.css" as="style"><link rel="modulepreload" href="/js/app.js"><link rel="stylesheet" href="/css/app.css"><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script></head><body><div id="toast" class="toast"></div><div id="root"><div class="jp-boot-shell" aria-live="polite" aria-busy="true"><div class="jp-boot-card"><div class="jp-boot-mark"><img src="/assets/brand/j-mark.svg" alt=""></div><div class="jp-boot-kicker">JUAN PROJECT ONLINE</div><div class="jp-boot-title">Getting your portal ready</div><div class="jp-boot-copy" id="jpBootCopy">Restoring your account and loading your latest project data.</div><div class="jp-boot-line"></div><div class="jp-boot-dots" aria-hidden="true"><i></i><i></i><i></i></div></div></div></div><script>setTimeout(()=>{const t=document.getElementById("jpBootCopy");if(t)t.textContent="Still connecting securely. Your account will stay signed in when the connection returns."},8000);</script><script type="module" src="/js/app.js"></script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}));}</script></body></html>
